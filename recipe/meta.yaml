package:
  name: amber_phenix
#  version 1.4.1 adds --openmp to configure
#  version 1.5   uses the new Jan 2022 code from Sergei
#  version 1.6   use more conda libraries -- no rism or fftw
#  version 1.7   update dat, leap, antechamber to current codes
  version: 1.7

source:
  git_url: https://github.com/bkpoon/phenix_amber.git
  git_rev: a1649405a4a719c747b74fd7473838734f13c3eb

build:
  skip: true  # [win]
  number: 0

requirements:
  build:
   - bison                                  # [build_platform != target_platform]
   - python                                 # [build_platform != target_platform]
   - cross-python_{{ target_platform }}     # [build_platform != target_platform]
   - numpy                                  # [build_platform != target_platform]
   - rsync                                  # [build_platform != target_platform]
   - make
   - {{ compiler('fortran') }}
   - {{ compiler('c') }}
   - {{ compiler('cxx') }}
   - llvm-openmp  # [osx]

  host:
   - bison
   - python
   - numpy
   - setuptools
   - bzip2
   - zlib
   - libnetcdf
   - netcdf-fortran
   - openblas
   - arpack
   - llvm-openmp  # [osx]

  run:
   - python
   - {{ pin_compatible('numpy') }}
   - libnetcdf
   - netcdf-fortran
   - openblas
   - arpack
   - llvm-openmp  # [osx]

about:
    home: https://www.phenix-online.org/documentation/reference/amber.html
    license: GNU General Public License (GPL/LGPL)
    license_file: LICENSE
    summary: Parts of AmberTools that are needed for interaction with the phenix crystallographic refinement package.

extra:
  recipe-maintainers:
    - bkpoon
    - dacase
